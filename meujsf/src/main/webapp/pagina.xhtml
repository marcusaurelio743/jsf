
<html xmlns="http://www.w3.org/1999/xhtml"
       xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html">
<h:head>
	<title>Olá JSF</title>
</h:head>

<h:body>
	
	<h:form id="formPessoa">
		
		<h:panelGrid columns="2">
			<f:facet name="header">
				<h:outputText value="Formulário de Cad. Usuário"/>
			</f:facet>
			
			ID:
			<h:inputText id="campoID" value="#{pessoaBean.pessoa.id}" readonly="true" />
			Nome:
			<h:inputText id="campoNome" value="#{pessoaBean.pessoa.nome}" />
			Sobrenome:
			<h:inputText id="campoSobreNome" value="#{pessoaBean.pessoa.sobrenome}" />
			Idade:
			<h:inputText id="campoIdade" value="#{pessoaBean.pessoa.idade}" />
			
			<h:outputText value="Sexo:"/>
			<h:selectOneMenu id="idSexo" required="true" value="#{pessoaBean.pessoa.sexo}">
				<f:selectItem itemLabel="----Selecione---" noSelectionOption="true"/>
				<f:selectItem itemValue="FEMININO" itemLabel="Feminino"/>
				<f:selectItem itemValue="MASCULINO" itemLabel="Masculino"/>
			</h:selectOneMenu>
			
			<h:outputText value="Fameworks:"/>
			<h:selectManyMenu id="idFramework" value="#{pessoaBean.pessoa.frameworks}" style="height: 150px;">
				
				<f:selectItem itemValue="JPA" />
				<f:selectItem itemValue="Hibernate" />
				<f:selectItem itemValue="Spring Boot" />
				<f:selectItem itemValue="JSF" />
			</h:selectManyMenu>
			<h:outputText value="Ativo"/>
			<h:selectBooleanCheckbox value="#{pessoaBean.pessoa.ativo}"/>
			<h:outputLabel value="Login"/> 
			<h:inputText value="#{pessoaBean.pessoa.login}"/>
			<h:outputLabel value="Senha"/>
			<h:inputSecret value="#{pessoaBean.pessoa.senha}"/>
			
			<h:outputText value="Perfil:"/>
			<h:selectOneMenu id="idPerfil" required="true" value="#{pessoaBean.pessoa.userPerfil}">
				<f:selectItem itemLabel="----Selecione---" noSelectionOption="true"/>
				<f:selectItem itemValue="Admin" itemLabel="Administrador(a)"/>
				<f:selectItem itemValue="Secretario" itemLabel="Secretário(a)"/>
				<f:selectItem itemValue="Diretor" itemLabel="Diretor(a)"/>
			</h:selectOneMenu>
		
		<h:outputLabel/>
		<h:panelGroup >
				<h:commandButton  value="Salvar" action="#{pessoaBean.salvar}"/>
				<h:commandButton  value="Novo" action="#{pessoaBean.novo}"/>
				<h:commandButton  value="Deletar" action="#{pessoaBean.deletar}"/>
				<h:commandButton value="Limpar" type="reset"/>
		</h:panelGroup>
		</h:panelGrid>
			
		<br/>
		
		
		<h:dataTable value="#{pessoaBean.pessoas}" var="p" border="3" cellpadding="2" >
			<f:facet name="header">Cadastros de Pessoa</f:facet>
			<h:column>
				<f:facet name="header">ID</f:facet>
				<h:outputText  value="#{p.id}"/>
			</h:column>
			<h:column>
			<f:facet name="header">Nome</f:facet>
				<h:outputText  value="#{p.nome}" style="padding:15px;"/>
			</h:column>
			<h:column>
				<f:facet name="header">Sobrenome</f:facet>
				<h:outputText  value="#{p.sobrenome}" style="padding:15px;"/>
			</h:column>
			<h:column>
				<f:facet name="header">Idade</f:facet>
				<h:outputText  value="#{p.idade}"/>
			</h:column>
			<h:column>
				<f:facet name="header">Ações</f:facet>
				<h:commandLink value="Editar" style="padding: 20px;">
					<f:setPropertyActionListener value="#{p}" target="#{pessoaBean.pessoa}"/>
				</h:commandLink>
				<h:commandLink value="Deletar" action="#{pessoaBean.deletar}" style="padding: 20px;">
					<f:setPropertyActionListener value="#{p}" target="#{pessoaBean.pessoa}"/>
				</h:commandLink>
			</h:column>
			
		</h:dataTable>
		
	</h:form>
</h:body>

</html>
