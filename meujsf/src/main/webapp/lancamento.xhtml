<html xmlns="http://www.w3.org/1999/xhtml"
       xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html">
<h:head>
	<title>Lançamentos </title>
</h:head>

<h:body>

<h:form>
		<h:commandLink value="Trocar Usuario" action="index" style="margin-left: 3cm;"/>
		<h:commandLink value="Home" action="pagina" style="margin-left: 3cm;"/>
		<h:commandLink value="Lançamentos" action="lancamento" style="margin-left: 3cm;"/>
	</h:form>

	<h:form id="formLancamento" >
		<h1>Tela de Lançamento</h1>
		
			<h:form id="formLancamento">
			<h:panelGrid columns="2" >
				<h:outputLabel value="ID"/>
				<h:inputText value="#{lancamentoBean.lancamento.id}" readonly="true"/>
				<h:outputLabel value="Nota"/>
				<h:inputText value="#{lancamentoBean.lancamento.numeroNota}" />
				<h:outputLabel value="Origem"/>
				<h:inputText value="#{lancamentoBean.lancamento.empresaOrigem}" />
				<h:outputLabel value="Destino"/>
				<h:inputText value="#{lancamentoBean.lancamento.empresaDestino}" />
				
				<h:outputLabel/>
				<h:panelGroup >
				<h:commandButton  value="Salvar" action="#{lancamentoBean.salvar}"/>
				<h:commandButton  value="Novo" action="#{lancamentoBean.novo}"/>
				<h:commandButton value="Limpar" type="reset"/>
		</h:panelGroup>
		</h:panelGrid>
			</h:form>
			
		
	</h:form>
</h:body>

</html>
